    - pandas>=2.2.0
    - transformers>=4.48.0
    - tqdm>=4.67.0
    - torchmetrics>=1.8.0
    - scikit-learn>=1.5.0
    - pyfastx>=2.2.0
    - bcbio-gff>=0.7.0
    - fair-esm>=2.0.0 